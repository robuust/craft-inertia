services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: inertia_poc_e2e
      POSTGRES_USER: inertia_poc_e2e
      POSTGRES_PASSWORD: local-e2e-only
    ports:
      - "127.0.0.1::5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inertia_poc_e2e -d inertia_poc_e2e"]
      interval: 1s
      timeout: 3s
      retries: 30
